name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock

      # Build in dependency order (algorithms first — core and adapters depend on it)
      - name: Build algorithms
        run: cd packages/algorithms && npm run build
      - name: Build core
        run: cd packages/core && npm run build
      - name: Build adapter-postgres
        run: cd packages/adapters/postgres && npm run build
      - name: Build adapter-sqlite
        run: cd packages/adapters/sqlite && npm run build
      - name: Build mcp
        run: cd packages/mcp && npm run build
      - name: Build ai-sdk
        run: cd packages/ai-sdk && npm run build

      # Type-check (after build so cross-package imports resolve)
      - name: Lint algorithms
        run: cd packages/algorithms && npx tsc --noEmit
      - name: Lint core
        run: cd packages/core && npx tsc --noEmit
      - name: Lint adapter-postgres
        run: cd packages/adapters/postgres && npx tsc --noEmit
      - name: Lint adapter-sqlite
        run: cd packages/adapters/sqlite && npx tsc --noEmit
      - name: Lint mcp
        run: cd packages/mcp && npx tsc --noEmit
      - name: Lint ai-sdk
        run: cd packages/ai-sdk && npx tsc --noEmit

      # Test all packages
      - name: Test algorithms
        run: cd packages/algorithms && npx vitest run
      - name: Test core
        run: cd packages/core && npx vitest run
      - name: Test adapter-postgres
        run: cd packages/adapters/postgres && npx vitest run --passWithNoTests
      - name: Test adapter-sqlite
        run: cd packages/adapters/sqlite && npx vitest run --passWithNoTests
      - name: Test mcp
        run: cd packages/mcp && npx vitest run
      - name: Test ai-sdk
        run: cd packages/ai-sdk && npx vitest run

      # Green unit tests do not prove the *binary* runs: a bad bin path, a broken
      # shebang or a native module that fails to load all pass in-process and fail
      # on a user's machine. Spawn the built entry point and talk MCP to it.
      - name: Smoke-test the MCP server binary
        run: node scripts/smoke-mcp.mjs

      # Smoke-test the self-contained example so it cannot silently rot
      - name: Smoke-test example (basic-chatbot)
        run: npx tsx examples/basic-chatbot.ts

      # The README claims zero runtime dependencies. Prove it against the packed
      # artifacts on every push, so the claim cannot quietly stop being true between
      # releases. This step sits inside the required `test` check by design.
      - name: Verify the zero-dependency claim
        run: bash scripts/verify-zero-dependencies.sh

      # A `files` entry is a claim about what users receive. All six packages
      # promised a LICENSE for months and shipped none, because npm silently
      # drops a `files` entry that matches nothing. Check the packed tarballs.
      - name: Verify every package ships what it promises
        run: bash scripts/verify-package-contents.sh

      # npm shows the licence, repository, homepage, issue tracker and author on every package
      # page. Until this check, adapter-sqlite, adapter-postgres, ai-sdk and mcp named no issue
      # tracker (`bugs`), and nothing noticed.
      - name: Package metadata names licence, repository, homepage, issue tracker and author
        run: node scripts/verify-package-metadata.mjs

      # A code block in a README is a claim that this code works. Until 0.5.2 nothing checked it:
      # the PostgreSQL quick start called three methods the adapter does not have, for months.
      # Compile every TypeScript block in the docs against the built packages, and type-check the
      # examples (the three third-party SDKs are stubbed in examples/types/).
      - name: Documentation snippets compile
        run: node scripts/check-doc-snippets.mjs
      - name: Examples type-check
        run: npx tsc -p examples

      # Every sentence that states how many tests there are must state what vitest collects.
      - name: Test counts in the docs match the suites
        run: node scripts/verify-test-counts.mjs

      # The plugin pins one @zensation/mcp version in five places, and a pin to a version that is
      # not on npm yet breaks every install. Check that they agree and that npm serves the pin.
      - name: Plugin pin, lock and docs agree, and npm serves the pin
        run: node scripts/verify-plugin-pin.mjs

      # The paper prints a reproduction procedure and an abstract sentence that says the
      # ablation tables reproduce in under a minute. Run it, and compare the numbers it
      # produces against the ones the published tables were generated from — otherwise
      # the claim stops being true the first time an algorithm changes, and nobody finds
      # out until a reviewer does. Point estimates must match exactly; the bootstrap
      # confidence bounds are unseeded and are reported separately, not asserted on.
      - name: Ablation tables still reproduce the published numbers
        run: |
          cd backend
          npm run experiments > run.log 2>&1 || (tail -40 run.log; exit 1)
          node scripts/extract-results.mjs run.log fresh/
          node scripts/verify-against-reference.mjs fresh/ results/

  # Every other job runs on Linux, and install-smoke tests what npm already ships, so the mcp
  # package was never built and tested on Windows or macOS before a release. This job does
  # that, with the Node versions of `test`. Tests that cannot run on Windows (unwritable
  # directories made with chmod, symbolic links) skip themselves there; the reason stands next
  # to each skipIf. Tests with a branch per platform (name lengths) run their macOS branch here.
  mcp-windows-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [22, 24, 26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock
      - name: Build algorithms, core, adapter-sqlite and mcp
        run: |
          cd packages/algorithms && npm run build
          cd ../core && npm run build
          cd ../adapters/sqlite && npm run build
          cd ../../mcp && npm run build
      - name: Lint mcp
        run: cd packages/mcp && npx tsc --noEmit
      - name: Test mcp
        run: cd packages/mcp && npx vitest run
      - name: MCP server smoke test
        run: node scripts/smoke-mcp.mjs

  # `engines` says `node >=22.14`. The `test` job runs the newest 22, 24 and 26, so the floor
  # itself was never run, and when this job first ran it (2026-11-21) the floor turned out to
  # be wrong: better-sqlite3 13 is built against Node-API 10, and on Node 22.0.0, 22.12.0 and
  # 22.13.0 it segfaulted on the first `new Database()`, also after `npm rebuild` on that
  # version, while 22.14.0 to 22.22.0 worked. So this job checks both sides of the floor the
  # way a user meets them: build with the newest 22 (the build tools need it; users install
  # `dist`), switch to the version under test, rebuild better-sqlite3 there, then run.
  # On 22.13.0 the server must refuse to start with a message, not crash; on 22.14.0 it must
  # serve (stdio, five tools, a memory stored and recalled) and load by `import` and `require()`.
  # `@zensation/adapter-sqlite` has the same floor and, since 0.2.9, its own check: it loads
  # better-sqlite3 in its constructor, after the check, so on 22.13.0 importing it must work and
  # constructing it must end in its message; on 22.14.0 it must answer through both entry ways.
  node-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '22.14.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Build algorithms, core, adapter-sqlite and mcp (newest Node 22)
        run: |
          cd packages/algorithms && npm run build
          cd ../core && npm run build
          cd ../adapters/sqlite && npm run build
          cd ../../mcp && npm run build
      - name: Switch to Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Runtime is Node ${{ matrix.node-version }}
        run: test "$(node --version)" = "v${{ matrix.node-version }}"
      - name: Install better-sqlite3 the way a user on this Node would (npm rebuild)
        run: npm rebuild better-sqlite3
      - name: Below the floor the server refuses to start, with a message
        if: matrix.node-version == '22.13.0'
        run: |
          set +e
          out=$(printf '' | node packages/mcp/dist/index.js 2>&1); code=$?
          echo "exit=$code"; echo "$out"
          test "$code" = 1 && echo "$out" | grep -q "needs Node 22.14 or newer"
      - name: Below the floor the SQLite adapter imports, and refuses to construct with a message
        if: matrix.node-version == '22.13.0'
        run: |
          node --input-type=module -e "
            const { SqliteAdapter } = await import('@zensation/adapter-sqlite');
            try { new SqliteAdapter({ filename: ':memory:' }); console.log('constructed on', process.version); process.exit(1); }
            catch (e) { console.log(e.message); if (!/needs Node 22[.]14 or newer/.test(e.message)) process.exit(1); }"
      - name: better-sqlite3 loads and answers
        if: matrix.node-version == '22.14.0'
        run: node -e "const D = require('better-sqlite3'); console.log(new D(':memory:').prepare('select sqlite_version() v').get(), process.version)"
      - name: MCP server smoke test
        if: matrix.node-version == '22.14.0'
        run: node scripts/smoke-mcp.mjs
      - name: import() and require() load both entry points
        if: matrix.node-version == '22.14.0'
        run: |
          node --input-type=module -e "await import('@zensation/mcp'); await import('@zensation/mcp/server'); console.log('import ok on', process.version)"
          node -e "require('@zensation/mcp'); require('@zensation/mcp/server'); console.log('require ok on', process.version)"
      - name: The SQLite adapter answers through import() and require()
        if: matrix.node-version == '22.14.0'
        run: |
          node --input-type=module -e "const { SqliteAdapter } = await import('@zensation/adapter-sqlite'); const a = new SqliteAdapter({ filename: ':memory:' }); console.log((await a.query('SELECT sqlite_version() AS v')).rows[0], 'import on', process.version)"
          node -e "const { SqliteAdapter } = require('@zensation/adapter-sqlite'); const a = new SqliteAdapter({ filename: ':memory:' }); a.query('SELECT sqlite_version() AS v').then((r) => console.log(r.rows[0], 'require on', process.version))"

  # The unit tests of adapter-postgres mock `pg`, so they never see what PostgreSQL itself
  # decides: the schema in sql/001_init.sql, uuid and JSONB columns, pgvector. Until this job
  # nothing in CI ran a single query against PostgreSQL, and procedures could not be stored
  # on it in any published version. ZENBRAIN_REQUIRE_PG makes the suite fail rather than skip.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: zenbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ZENBRAIN_TEST_PG_URL: postgres://postgres:zenbrain@localhost:5432/postgres
      ZENBRAIN_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Build algorithms, core and adapter-postgres
        run: |
          cd packages/algorithms && npm run build
          cd ../core && npm run build
          cd ../adapters/postgres && npm run build
      - name: Real PostgreSQL suite
        run: cd packages/adapters/postgres && npx vitest run __tests__/real-postgres.test.ts

  publish:
    needs: [test, node-floor, mcp-windows-macos, postgres]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm install --no-package-lock
      # Build order matters: algorithms -> core -> adapters (each depends on the previous).
      - run: cd packages/algorithms && npm run build
      - run: cd packages/core && npm run build
      - run: cd packages/adapters/postgres && npm run build
      - run: cd packages/adapters/sqlite && npm run build
      - run: cd packages/mcp && npm run build
      - run: cd packages/ai-sdk && npm run build
      # Auth is via OIDC trusted publishing configured on npmjs.com (no NPM_TOKEN);
      # provenance attestations are generated automatically.
      # Idempotent: only publish a version that is not already on the registry,
      # so re-tagging or a tag that touches only one package never fails.
      - name: Publish algorithms (skip if already published)
        run: |
          cd packages/algorithms
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/algorithms@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/algorithms@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish core (skip if already published)
        run: |
          cd packages/core
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/core@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/core@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish adapter-postgres (skip if already published)
        run: |
          cd packages/adapters/postgres
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/adapter-postgres@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/adapter-postgres@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish adapter-sqlite (skip if already published)
        run: |
          cd packages/adapters/sqlite
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/adapter-sqlite@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/adapter-sqlite@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      # Deliberately LAST. Trusted Publishing is configured per package on npmjs.com,
      # and this job stops at the first failure — the half-release of 05.08.2026 is
      # exactly that lesson. Until @zensation/mcp has its own trusted publisher, this
      # step can fail without taking the four established packages down with it.
      - name: Publish mcp (skip if already published)
        run: |
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/mcp@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      # Same reasoning as the mcp step above: trusted publishing is per package and
      # this job stops at the first failure, so a package without a publisher yet must
      # not sit in front of the established ones.
      - name: Publish ai-sdk (skip if already published)
        run: |
          cd packages/ai-sdk
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/ai-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/ai-sdk@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
