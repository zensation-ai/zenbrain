name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock

      # Build in dependency order (algorithms first — core and adapters depend on it)
      - name: Build algorithms
        run: cd packages/algorithms && npm run build
      - name: Build core
        run: cd packages/core && npm run build
      - name: Build adapter-postgres
        run: cd packages/adapters/postgres && npm run build
      - name: Build adapter-sqlite
        run: cd packages/adapters/sqlite && npm run build
      - name: Build mcp
        run: cd packages/mcp && npm run build
      - name: Build ai-sdk
        run: cd packages/ai-sdk && npm run build

      # Type-check (after build so cross-package imports resolve)
      - name: Lint algorithms
        run: cd packages/algorithms && npx tsc --noEmit
      - name: Lint core
        run: cd packages/core && npx tsc --noEmit
      - name: Lint adapter-postgres
        run: cd packages/adapters/postgres && npx tsc --noEmit
      - name: Lint adapter-sqlite
        run: cd packages/adapters/sqlite && npx tsc --noEmit
      - name: Lint mcp
        run: cd packages/mcp && npx tsc --noEmit
      - name: Lint ai-sdk
        run: cd packages/ai-sdk && npx tsc --noEmit

      # Test all packages
      - name: Test algorithms
        run: cd packages/algorithms && npx vitest run
      - name: Test core
        run: cd packages/core && npx vitest run
      - name: Test adapter-postgres
        run: cd packages/adapters/postgres && npx vitest run --passWithNoTests
      - name: Test adapter-sqlite
        run: cd packages/adapters/sqlite && npx vitest run --passWithNoTests
      - name: Test mcp
        run: cd packages/mcp && npx vitest run
      - name: Test ai-sdk
        run: cd packages/ai-sdk && npx vitest run

      # Green unit tests do not prove the *binary* runs: a bad bin path, a broken
      # shebang or a native module that fails to load all pass in-process and fail
      # on a user's machine. Spawn the built entry point and talk MCP to it.
      - name: Smoke-test the MCP server binary
        run: node scripts/smoke-mcp.mjs

      # Smoke-test the self-contained example so it cannot silently rot
      - name: Smoke-test example (basic-chatbot)
        run: npx tsx examples/basic-chatbot.ts

      # The README claims zero runtime dependencies. Prove it against the packed
      # artifacts on every push, so the claim cannot quietly stop being true between
      # releases. This step sits inside the required `test` check by design.
      - name: Verify the zero-dependency claim
        run: bash scripts/verify-zero-dependencies.sh

      # A `files` entry is a claim about what users receive. All six packages
      # promised a LICENSE for months and shipped none, because npm silently
      # drops a `files` entry that matches nothing. Check the packed tarballs.
      - name: Verify every package ships what it promises
        run: bash scripts/verify-package-contents.sh

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm install --no-package-lock
      # Build order matters: algorithms -> core -> adapters (each depends on the previous).
      - run: cd packages/algorithms && npm run build
      - run: cd packages/core && npm run build
      - run: cd packages/adapters/postgres && npm run build
      - run: cd packages/adapters/sqlite && npm run build
      - run: cd packages/mcp && npm run build
      - run: cd packages/ai-sdk && npm run build
      # Auth is via OIDC trusted publishing configured on npmjs.com (no NPM_TOKEN);
      # provenance attestations are generated automatically.
      # Idempotent: only publish a version that is not already on the registry,
      # so re-tagging or a tag that touches only one package never fails.
      - name: Publish algorithms (skip if already published)
        run: |
          cd packages/algorithms
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/algorithms@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/algorithms@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish core (skip if already published)
        run: |
          cd packages/core
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/core@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/core@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish adapter-postgres (skip if already published)
        run: |
          cd packages/adapters/postgres
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/adapter-postgres@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/adapter-postgres@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      - name: Publish adapter-sqlite (skip if already published)
        run: |
          cd packages/adapters/sqlite
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/adapter-sqlite@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/adapter-sqlite@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      # Deliberately LAST. Trusted Publishing is configured per package on npmjs.com,
      # and this job stops at the first failure — the half-release of 05.08.2026 is
      # exactly that lesson. Until @zensation/mcp has its own trusted publisher, this
      # step can fail without taking the four established packages down with it.
      - name: Publish mcp (skip if already published)
        run: |
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/mcp@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
      # Same reasoning as the mcp step above: trusted publishing is per package and
      # this job stops at the first failure, so a package without a publisher yet must
      # not sit in front of the established ones.
      - name: Publish ai-sdk (skip if already published)
        run: |
          cd packages/ai-sdk
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/ai-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/ai-sdk@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi
